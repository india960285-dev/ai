<!DOCTYPE html>
<html>
<head>
  <title>AI Agent Platform</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 30px;
      background: #020617;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: cyan;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: 40px;
    }

    .hero p {
      color: #94a3b8;
      margin-top: 10px;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 20px;
      background: cyan;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 40px;
      flex-wrap: wrap;
    }

    .card {

      border-radius: 10px;
    }

      color: cyan;
    }

</div>

<div class="hero">

  <p>Chat, Understand Users & Generate Content Automatically</p>
  <button class="btn" onclick="startApp()">Start Now</button>
</div>

<div class="features">

  <div class="card">
    <h3>🤖 Chat Agent</h3>
    <p>Talk with users like a human</p>
  </div>

  <div class="card">
    <h3>🎥 Video Generator</h3>
    <p>Create AI videos automatically</p>
  </div>

  <div class="card">
    <h3>⚡ Smart Reply</h3>
    <p>Instant AI-based responses</p>
  </div>

</div>

<script>
function startApp() {
  alert("Next step: Chat system coming...");
}
</script>

</body>
</html>
