<!DOCTYPE html>
<html>
<head>
  <title>AI Agent</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    #chatBox {
      width: 80%;
      height: 350px;
      margin: auto;
      border: 1px solid gray;
      overflow-y: auto;
      padding: 10px;
      text-align: left;
    }

    input {
      width: 60%;
      padding: 10px;
    }

    button {
      padding: 10px;
      background: cyan;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>AI Agent</h2>

<button onclick="logout()">Logout</button>

<div id="chatBox"></div>

<br>

<input id="input" placeholder="Type your answer...">
<button onclick="send()">Send</button>

<script>

// 🔐 LOGIN CHECK
const user = JSON.parse(localStorage.getItem("user"));
if (!user) {
  window.location.href = "login.html";
}

// logout
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

// chat system
let step = 0;
let userData = {};

function startConversation() {
  addMessage("AI", "Do you want business ideas?");
  step = 1;
}

function send() {
  let msg = document.getElementById("input").value;
  if (!msg) return;

  addMessage("User", msg);
  handleFlow(msg.toLowerCase());

  document.getElementById("input").value = "";
}

function addMessage(sender, text) {
  let box = document.getElementById("chatBox");
  box.innerHTML += "<p><b>" + sender + ":</b> " + text + "</p>";
  box.scrollTop = box.scrollHeight;
}

function handleFlow(msg) {

  if (step === 1) {
    addMessage("AI", "What type of business do you prefer?");
    step = 2;
  }

  else if (step === 2) {
    userData.type = msg;
    addMessage("AI", "What is your budget?");
    step = 3;
  }

  else if (step === 3) {
    userData.budget = msg;
    addMessage("AI", "Do you want video?");
    step = 4;
  }

  else if (step === 4) {
    if (msg.includes("yes")) {
      addMessage("AI", "Enter video topic");
      step = 5;
    } else {
      finish();
    }
  }

  else if (step === 5) {
    userData.topic = msg;
    finish();
  }
}

startConversation();

</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_YOUR_KEY",
  authDomain: "PASTE_YOUR_DOMAIN",
  projectId: "PASTE_YOUR_ID",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 plan check
async function checkPlan() {
  const user = JSON.parse(localStorage.getItem("user"));
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (snap.exists()) {
    const data = snap.data();

    document.getElementById("chatBox").innerHTML +=
      "<p><b>Plan:</b> " + data.plan + " | Expiry: " + data.expiry + "</p>";
  }
}

checkPlan();

</script>

</body>
</html>
