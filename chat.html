<!DOCTYPE html>
<html>
<head>
  <title>AI Agent</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    #chatBox {
      width: 80%;
      height: 350px;
      margin: auto;
      border: 1px solid gray;
      overflow-y: auto;
      padding: 10px;
      text-align: left;
    }

    input {
      width: 60%;
      padding: 10px;
    }

    button {
      padding: 10px;
      background: cyan;
      border: none;
    }
  </style>
</head>

<body>

<h2>AI Agent</h2>

<div id="chatBox"></div>

<br>

<input id="input" placeholder="Type your answer...">
<button onclick="send()">Send</button>
const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
  window.location.href = "login.html";
}
<script>

let step = 0;
let userData = {};

function startConversation() {
  addMessage("AI", "Do you want business ideas?");
  step = 1;
}

function send() {
  let msg = document.getElementById("input").value;
  if (!msg) return;

  addMessage("User", msg);
  handleFlow(msg.toLowerCase());

  document.getElementById("input").value = "";
}

function addMessage(sender, text) {
  let box = document.getElementById("chatBox");
  box.innerHTML += "<p><b>" + sender + ":</b> " + text + "</p>";
  box.scrollTop = box.scrollHeight;
}

function handleFlow(msg) {

  if (step === 1) {
    if (msg.includes("yes")) {
      addMessage("AI", "What type of business do you prefer? Online or offline?");
      step = 2;
    } else {
      addMessage("AI", "Okay. What do you want to create?");
      step = 10;
    }
  }

  else if (step === 2) {
    userData.type = msg;
    addMessage("AI", "What is your budget?");
    step = 3;
  }

  else if (step === 3) {
    userData.budget = msg;
    addMessage("AI", "Do you want a video explanation also?");
    step = 4;
  }

  else if (step === 4) {
    if (msg.includes("yes")) {
      addMessage("AI", "Enter your video topic.");
      step = 5;
    } else {
      finish();
    }
  }

  else if (step === 5) {
    userData.topic = msg;
    finish();
  }

  else {
    addMessage("AI", "Please follow the steps.");
  }
}

function finish() {
  addMessage("AI", "Your request is recorded.");
  console.log("USER DATA:", userData);
  step = 0;
}

startConversation();

</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDYIOpjA-7nBiV6FCivGlbr4oMX-CYAufg",
    authDomain: "appmarket24.firebaseapp.com",
    projectId: "appmarket24",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
  window.addDoc = addDoc;
  window.collection = collection;
</script>

  
</body>
</html>
